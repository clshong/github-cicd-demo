name: CI/CD

on:
  push:
    branches:
      - main
      - 'dev_*'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-dev:
    needs: build

    if: startsWith(github.ref_name, 'dev_')

    runs-on: ubuntu-latest

    environment:
      name: development

    steps:
      - name: Deploy Dev
        uses: actions/deploy-pages@v4

  deploy-prod:
    needs: build

    if: github.ref_name == 'main'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Deploy Production
        uses: actions/deploy-pages@v4